<!doctype html>
<html lang="th" data-theme="light" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#062A30">
<script>
(function(){try{
  var p=JSON.parse(localStorage.getItem('dontum.console.v1')||'null');
  var t=(p&&p.prefs&&p.prefs.theme==='dark')?'dark':'light';
  var d=(p&&p.prefs&&p.prefs.density==='compact')?'compact':'cozy';
  document.documentElement.dataset.theme=t;
  document.documentElement.dataset.density=d;
  if(p&&p.prefs&&p.prefs.rail==='mini')document.documentElement.classList.add('pre-mini');
}catch(e){}})();
</script>
<title>แผงจัดการ · ระบบแบบฟอร์มอิเล็กทรอนิกส์ โรงพยาบาลดอนตูม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body class="boot">
<div class="bg-field" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
  <div class="grain"></div>
</div>

<a class="skip" href="#main">ข้ามไปเนื้อหาหลัก</a>

<header class="topbar">
  <button class="rail-toggle" id="railToggle" title="ย่อ/ขยายเมนู (Ctrl+B)" aria-label="ย่อขยายเมนู"></button>
  <div class="brand">
    <div class="brand-mark" id="brandMark">ด</div>
    <div class="brand-txt">
      <b>โรงพยาบาลดอนตูม</b>
      <span>DONTUM e-FORM · ADMIN CONSOLE</span>
    </div>
  </div>

  <button class="omni" id="omniBtn">
    <span class="omni-ico"></span>
    <span class="omni-txt">ค้นหาฟอร์ม คำขอ บุคลากร หรือสั่งงาน…</span>
    <kbd>Ctrl</kbd><kbd>K</kbd>
  </button>

  <div class="top-actions">
    <div class="mode-chip" id="modeChip" title="แหล่งข้อมูลที่ใช้แสดง"></div>
    <button class="ico-btn" id="densityBtn" title="ความหนาแน่นตาราง"></button>
    <button class="ico-btn" id="themeBtn" title="สลับธีม (Ctrl+J)"></button>
    <button class="ico-btn bell" id="bellBtn" title="การแจ้งเตือน"><span class="dot" id="bellDot" hidden></span></button>
    <button class="ico-btn" id="helpBtn" title="คีย์ลัด (?)"></button>
    <div class="user-chip"><span class="avatar">ผ</span><div><b>ผู้ดูแลระบบ</b><i>ADMIN</i></div></div>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="เมนูหลัก">
    <div class="rail-group">
      <span class="rail-label">จัดการแบบฟอร์ม</span>
      <button class="rail-item" data-go="forms"><i></i><span>คลังแบบฟอร์ม</span><b class="cnt" data-cnt="forms"></b></button>
      <button class="rail-item" data-go="builder"><i></i><span>ออกแบบฟอร์ม</span><b class="cnt" data-cnt="builder"></b></button>
    </div>
    <div class="rail-group">
      <span class="rail-label">คำขอ</span>
      <button class="rail-item" data-go="inbox"><i></i><span>กล่องคำขอ</span><b class="cnt hot" data-cnt="inbox"></b></button>
      <button class="rail-item" data-go="mine"><i></i><span>คำขอของฉัน</span><b class="cnt" data-cnt="mine"></b></button>
    </div>
    <div class="rail-group">
      <span class="rail-label">ตั้งค่าองค์กร</span>
      <button class="rail-item" data-go="staff"><i></i><span>บุคลากร</span><b class="cnt" data-cnt="staff"></b></button>
      <button class="rail-item" data-go="brand"><i></i><span>ตราสัญลักษณ์</span></button>
    </div>
    <div class="rail-group">
      <span class="rail-label">มุมมองผู้ใช้</span>
      <button class="rail-item" data-go="public"><i></i><span>หน้ากรอกฟอร์ม</span></button>
    </div>
    <div class="rail-foot">
      <div class="quota">
        <div class="quota-top"><span>คำขอเดือนนี้</span><b id="quotaNum">0</b></div>
        <div class="quota-bar"><i id="quotaBar"></i></div>
        <small id="quotaHint"></small>
      </div>
    </div>
  </nav>

  <main class="main" id="main">
    <div class="crumbs" id="crumbs"></div>
    <div id="view"></div>
  </main>
</div>

<!-- Detail drawer -->
<div class="drawer-scrim" id="drawerScrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog">
  <header class="drawer-head">
    <div><span class="drawer-kicker" id="drawerKicker"></span><h3 id="drawerTitle"></h3></div>
    <button class="ico-btn" id="drawerClose" title="ปิด (Esc)"></button>
  </header>
  <div class="drawer-body" id="drawerBody"></div>
  <footer class="drawer-foot" id="drawerFoot"></footer>
</aside>

<!-- Command palette -->
<div class="palette-scrim" id="paletteScrim" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="คำสั่งด่วน">
    <div class="palette-input"><span class="omni-ico"></span><input id="paletteInput" placeholder="พิมพ์คำสั่ง หรือค้นหา… เช่น อนุมัติ, คัดลอก, บุคลากร" autocomplete="off"><kbd>Esc</kbd></div>
    <div class="palette-list" id="paletteList"></div>
    <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> เลือก</span><span><kbd>Enter</kbd> เรียกใช้</span><span><kbd>Ctrl</kbd><kbd>K</kbd> เปิด/ปิด</span></div>
  </div>
</div>

<!-- Notifications -->
<div class="notif" id="notif" hidden>
  <header><b>การแจ้งเตือน</b><button class="mini" id="notifClear">ล้างทั้งหมด</button></header>
  <div id="notifList"></div>
</div>

<!-- Shortcuts -->
<div class="modal-scrim" id="helpScrim" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <header><h3>คีย์ลัดทั้งหมด</h3><button class="ico-btn" data-close-modal></button></header>
    <div class="modal-body" id="helpBody"></div>
  </div>
</div>

<!-- Generic modal -->
<div class="modal-scrim" id="modalScrim" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <header><h3 id="modalTitle"></h3><button class="ico-btn" data-close-modal></button></header>
    <div class="modal-body" id="modalBody"></div>
    <footer id="modalFoot"></footer>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="logoFile" accept="image/*" hidden>

<script src="app.js"></script>
</body>
</html>
